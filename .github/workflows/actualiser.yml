name: Actualiser les tournois

on:
  schedule:
    - cron: "0 5 * * *"   # 5 h UTC : 7 h à Paris l'été, 6 h l'hiver
  workflow_dispatch:       # bouton "Run workflow" pour forcer une mise à jour

permissions:
  contents: write

concurrency:
  group: actualisation
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # fiches Ten'Up et coordonnées des clubs Playtomic : évite de tout redemander chaque jour
      - uses: actions/cache@v4
        with:
          path: .cache
          key: padel-cache-${{ github.run_id }}
          restore-keys: padel-cache-

      - name: Garder les données de la veille
        run: cp public/data.json "$RUNNER_TEMP/veille.json"

      - name: Récupérer les tournois
        run: python padel_lyon.py --niveaux tous --rayon 40 --no-open --json public/data.json

      - name: Publier data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Tournois du $(date -u +%F)"
            git push
          fi

      # Après la publication : une alerte qui échoue ne bloque pas la mise à jour du site
      - name: Alerter des nouveaux tournois
        continue-on-error: true
        env:
          ALERTE_URLS: ${{ secrets.ALERTE_URLS }}
          ALERTE_NIVEAUX: ${{ vars.ALERTE_NIVEAUX }}
          ALERTE_RAYON: ${{ vars.ALERTE_RAYON }}
          ALERTE_SITE: ${{ vars.ALERTE_SITE }}
        run: |
          pip install apprise
          python alerte.py "$RUNNER_TEMP/veille.json" public/data.json
